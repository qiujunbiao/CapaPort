packages:
  - apps/*
  - packages/*
  - adapters/*

allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: false
  protobufjs: true

minimumReleaseAgeExclude:
  - tsx@4.23.10
  - '@aws-sdk/client-s3@3.1105.0'
  - '@aws-sdk/s3-request-presigner@3.1105.0'
  - lucide-react@1.30.0
  - '@google-cloud/recaptcha-enterprise@7.0.0'
