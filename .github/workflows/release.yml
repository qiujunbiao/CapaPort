name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm brand:check
      - run: pnpm migrations:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm security:gate
      - run: pnpm build
      - run: pnpm sdk:check
      - run: pnpm stack:smoke
      - run: pnpm acceptance
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  cli:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm artifacts:cli
      - uses: actions/upload-artifact@v4
        with:
          name: capaport-cli
          path: artifacts/capaport-cli.mjs*
          if-no-files-found: error

  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate hosted client endpoint
        env:
          CAPAPORT_API_URL: ${{ vars.CAPAPORT_API_URL }}
        run: test -n "$CAPAPORT_API_URL"
      - run: pnpm --filter @capaport/web build
        env:
          VITE_API_URL: ${{ vars.CAPAPORT_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: capaport-web
          path: apps/web/dist/**/*
          if-no-files-found: error

  desktop:
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: capaport-macos
            platform: macos
            arch: universal
            target: universal-apple-darwin
            bundle: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-2025
            artifact: capaport-windows
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            bundle: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Validate hosted client endpoint
        shell: bash
        env:
          CAPAPORT_API_URL: ${{ vars.CAPAPORT_API_URL }}
        run: test -n "$CAPAPORT_API_URL"
      - name: Validate production updater configuration
        run: pnpm release:preflight
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc
      - if: runner.os == 'macOS'
        env:
          VITE_API_URL: ${{ vars.CAPAPORT_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD -or -not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'Windows and updater signing secrets are required.' }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP 'capaport-signing.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item $path -Force
      - if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          VITE_API_URL: ${{ vars.CAPAPORT_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: --bundles app,dmg --target universal-apple-darwin
      - if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          VITE_API_URL: ${{ vars.CAPAPORT_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: >-
            --bundles nsis --target x86_64-pc-windows-msvc
            --config '{"bundle":{"windows":{"certificateThumbprint":"${{ env.WINDOWS_CERTIFICATE_THUMBPRINT }}","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}'
      - uses: anchore/sbom-action@v0
        with:
          path: ${{ matrix.bundle }}
          format: spdx-json
          output-file: ${{ matrix.bundle }}/capaport.spdx.json
          upload-artifact: false
      - run: >-
          pnpm exec tsx scripts/package-desktop-release.ts
          --root "${{ matrix.bundle }}"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --version "${{ github.ref_name }}"
          --commit "${{ github.sha }}"
      - if: runner.os == 'macOS'
        run: test -f "${{ matrix.bundle }}/SHA256SUMS"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "${{ matrix.bundle }}/SHA256SUMS")) { throw 'SHA256SUMS missing.' }
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ matrix.bundle }}/**/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}/**/*
          if-no-files-found: error

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm images:build -- --registry ghcr.io/${{ github.repository_owner }} --push

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, web, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: capaport-*
          path: release-assets
      - name: Create signed updater manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          pnpm exec tsx -e
          "import { createUpdaterManifest } from './scripts/create-updater-manifest.ts';
          await createUpdaterManifest({root:'release-assets',version:process.env.RELEASE_VERSION.replace(/^v/,''),repository:process.env.GITHUB_REPOSITORY,tag:process.env.RELEASE_VERSION,output:'release-assets/latest.json'});"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/latest.json
            release-assets/**/*.dmg
            release-assets/**/*.app.tar.gz
            release-assets/**/*.app.tar.gz.sig
            release-assets/**/*-setup.exe
            release-assets/**/*.nsis.zip
            release-assets/**/*.nsis.zip.sig
            release-assets/**/SHA256SUMS
            release-assets/**/release-metadata.json
            release-assets/**/capaport.spdx.json
            release-assets/**/*.mjs
            release-assets/**/*.sha256
