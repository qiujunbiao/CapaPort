[package]
name = "capaport-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "capaport_runtime"
path = "src/lib.rs"

[[bin]]
name = "capaport-desktop"
path = "src/main.rs"

[[bin]]
name = "capaport-runtime-harness"
path = "src/bin/runtime_harness.rs"

[features]
default = []
tauri-app = [
  "dep:directories",
  "dep:keyring",
  "dep:reqwest",
  "dep:tauri",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-updater",
]

[dependencies]
base64 = "0.22.1"
directories = { version = "6.0.0", optional = true }
hex = "0.4.3"
keyring = { version = "4.1.5", optional = true }
parking_lot = "0.12.5"
regex = "1.11.2"
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["rustls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
thiserror = "2.0.17"
toml = "0.9.8"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.23.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
