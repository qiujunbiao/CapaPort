name: capaport

x-backend-environment: &backend-environment
  NODE_ENV: development
  PORT: 3100
  DATABASE_URL: postgres://capaport:capaport-development@postgres:5432/capaport
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
  S3_REGION: us-east-1
  S3_BUCKET: capaport
  S3_ACCESS_KEY: capaport
  S3_SECRET_KEY: capaport-minio-development
  JWT_SECRET: capaport-jwt-development-secret-change-me-now
  REFRESH_TOKEN_PEPPER: capaport-refresh-development-pepper-change-me
  VERIFICATION_PEPPER: capaport-verification-development-pepper-change-me
  METRICS_TOKEN: capaport-development-metrics-token
  ACCESS_TOKEN_TTL_SECONDS: 900
  REFRESH_TOKEN_TTL_DAYS: 30
  VERIFICATION_TTL_MINUTES: 10
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: CapaPort <no-reply@capaport.local>

x-backend: &backend
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
  environment: *backend-environment
  user: 10001:10001
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: capaport
      POSTGRES_USER: capaport
      POSTGRES_PASSWORD: capaport-development
    healthcheck:
      test: [CMD-SHELL, pg_isready -U capaport -d capaport]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: capaport
      MINIO_ROOT_PASSWORD: capaport-minio-development
    ports:
      - ${MINIO_API_PORT:-9000}:9000
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 capaport capaport-minio-development &&
        mc mb --ignore-existing local/capaport
    restart: no

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - ${MAILPIT_HTTP_PORT:-8025}:8025

  migrate:
    <<: *backend
    command: [migrate]
    restart: no

  api:
    <<: *backend
    command: [api]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - ${API_PORT:-3210}:3100
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: [worker]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: ${WEB_API_URL:-http://127.0.0.1:3210/api/v1}
    user: 101:101
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${WEB_PORT:-1430}:8080
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
