name: agentdoor

x-backend-environment: &backend-environment
  NODE_ENV: development
  PORT: 3100
  DATABASE_URL: postgres://agentdoor:agentdoor-development@postgres:5432/agentdoor
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: agentdoor
  S3_ACCESS_KEY: agentdoor
  S3_SECRET_KEY: agentdoor-minio-development

x-backend: &backend
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
  environment: *backend-environment
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentdoor
      POSTGRES_USER: agentdoor
      POSTGRES_PASSWORD: agentdoor-development
    healthcheck:
      test: [CMD-SHELL, pg_isready -U agentdoor -d agentdoor]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: agentdoor
      MINIO_ROOT_PASSWORD: agentdoor-minio-development
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 agentdoor agentdoor-minio-development &&
        mc mb --ignore-existing local/agentdoor
    restart: no

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - ${MAILPIT_HTTP_PORT:-8025}:8025

  migrate:
    <<: *backend
    command: [migrate]
    restart: no

  api:
    <<: *backend
    command: [api]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - ${API_PORT:-3210}:3100
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: [worker]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  minio-data:
